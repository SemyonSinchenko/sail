[package]
name = "sail-worker-extension-probe"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
datafusion = { version = "=55.1.0", default-features = false, features = ["recursive_protection"] }
datafusion-common = { version = "=55.1.0", default-features = false }
arrow-schema = { version = "=59.3.0", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
[profile.dev]
debug = 0
incremental = false
